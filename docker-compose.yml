services:
  passauth:
    image: ghcr.io/fahed-alhammadi/passauth:latest
    container_name: passauth
    restart: unless-stopped
    ports:
      - "8080:8080"                 # behind a reverse proxy on this host: "127.0.0.1:8080:8080"
    env_file: .env
    volumes:
      - ./data:/data                # PassAuth's database and icon cache
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]  # used only at startup to switch to PUID/PGID
