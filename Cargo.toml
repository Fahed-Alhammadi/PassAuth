[workspace]
resolver = "2"
members = ["crates/core", "crates/core-ffi", "crates/core-wasm", "crates/server"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Fahed-Alhammadi/PassAuth"

[profile.release]
lto = true
codegen-units = 1
strip = true
# No `panic = "abort"`: a panic in one request handler must not take down the
# whole server, and UniFFI turns panics into errors for the mobile apps only
# when unwinding is available. (Cargo can't set `panic` per package.)

# wasm-bindgen needs the target_features section that `strip` removes.
[profile.release.package.passauth-core-wasm]
strip = false
opt-level = 3
