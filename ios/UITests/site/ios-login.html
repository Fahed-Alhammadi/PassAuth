<!doctype html>
<!-- Test page for ios/UITests/AutoFillUITests.swift (AF3, AF4): a sign-in form with a code field. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Test: sign in</title>
<style>
  body { font: 17px -apple-system, sans-serif; margin: 24px; }
  label { display: block; margin-top: 16px; }
  input { display: block; width: 100%; box-sizing: border-box; font: inherit; padding: 10px; margin-top: 4px; }
  button { font: inherit; padding: 10px 16px; margin-top: 20px; }
</style>
</head>
<body>
<h1>Sign in</h1>
<form id="login" action="ios-login.html" method="get" onsubmit="return false">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" aria-label="Email" autocomplete="username" autocapitalize="none">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" aria-label="Password" autocomplete="current-password">
  <label for="code">Code</label>
  <input id="code" name="code" type="text" aria-label="Code" placeholder="Paste code here" autocomplete="off" inputmode="numeric">
  <button type="submit">Sign in</button>
</form>
</body>
</html>
