# Desktop app (Tauri, reuses web/src) + its macOS AutoFill extension (reuses ios/Shared).
# Runs only when the desktop app or code it is built from changes.
name: CI desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/build-wasm.sh"
      - "scripts/build-macos-core.sh"
      - "ios/Shared/**"
      - "ios/AutoFill/**"
      - "ios/UI/**"
      - ".github/workflows/ci-desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/build-wasm.sh"
      - "scripts/build-macos-core.sh"
      - "ios/Shared/**"
      - "ios/AutoFill/**"
      - "ios/UI/**"
      - ".github/workflows/ci-desktop.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: desktop app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The root workspace builds the core for the browser; the app is its own workspace.
          workspaces: |
            .
            desktop/src-tauri
      - name: Install wasm-bindgen CLI (version from Cargo.lock)
        run: |
          v="$(grep -A3 'name = "wasm-bindgen"' Cargo.lock | grep -m1 version | cut -d'"' -f2)"
          cargo install wasm-bindgen-cli --version "$v" --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: scripts/build-wasm.sh web/src/wasm
      # The desktop app imports web/src, whose imports resolve from web/node_modules.
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm build
        working-directory: desktop
      # The Rust shell embeds the built frontend, so it is checked after `pnpm build`.
      - run: cargo fmt --all --check && cargo clippy --all-targets --locked -- -D warnings
        working-directory: desktop/src-tauri

  # The desktop app is its own Cargo workspace with its own lockfile.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: desktop/src-tauri

  autofill:
    name: macOS AutoFill extension
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Unit tests
        run: |
          scripts/build-macos-core.sh
          cd desktop/macos && xcodegen generate
          xcodebuild -project PassAuthAutoFill.xcodeproj -scheme PassAuthAutoFill -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO test -quiet
