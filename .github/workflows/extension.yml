name: Extension release

# Push a tag like extension-v1.2.3 (scripts/release.sh extension 1.2.3) to build the Chrome
# extension and publish passauth-extension-1.2.3.zip as a GitHub release (the zip to upload to
# the Chrome Web Store). The version comes from extension/package.json and
# extension/public/manifest.json, which must both match the tag (the Web Store needs a higher
# manifest version for every upload).
on:
  push:
    tags: ["extension-v*.*.*"]

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#extension-v}"
          pkg="$(node -p "require('./extension/package.json').version")"
          manifest="$(node -p "require('./extension/public/manifest.json').version")"
          [ "${tag%%-*}" = "$pkg" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match extension/package.json $pkg"; exit 1; }
          [ "$pkg" = "$manifest" ] || { echo "::error::manifest.json version $manifest differs from package.json $pkg"; exit 1; }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI
        run: |
          v="$(grep -A3 'name = "wasm-bindgen"' Cargo.lock | grep -m1 version | cut -d'"' -f2)"
          cargo install wasm-bindgen-cli --version "$v" --locked
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Build Chrome extension
        run: |
          # The extension reuses web vault components, which import the web copy of the core.
          scripts/build-wasm.sh web/src/wasm
          scripts/build-wasm.sh extension/src/wasm
          cd extension
          pnpm install --frozen-lockfile
          pnpm package
          mv passauth-extension.zip "../passauth-extension-${GITHUB_REF_NAME#extension-v}.zip"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#extension-v}"
          pre=()
          [[ "$v" == *-* ]] && pre=(--prerelease)
          # Own notes: --generate-notes would diff against the newest release of any part.
          scripts/release-notes.sh "$GITHUB_REF_NAME" \
            extension web/src crates/core crates/core-wasm > notes.md
          gh release create "$GITHUB_REF_NAME" --notes-file notes.md \
            --title "PassAuth extension v$v" \
            "passauth-extension-$v.zip" "${pre[@]}"
