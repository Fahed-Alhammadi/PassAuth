# Web vault + Chrome and Firefox extension.
# - Push to main / pull request: builds and tests the web vault, checks that the shared golden
#   vectors (testdata/vectors.json) are the answers of the core being built (the extension's site
#   logic is the core's), then lints (Biome), tests (incl. its wrappers against the vectors) and
#   builds the extension against the browser build of the core, for Chrome and for Firefox (checked by
#   Mozilla's web-ext lint).
# - Push a tag like extension-1.2.3 (scripts/release.sh extension 1.2.3) to build the extension and
#   submit it to the Chrome Web Store and to addons.mozilla.org (Firefox, with its source archive,
#   scripts/firefox-source.sh). There is no GitHub release: the zips (passauth-extension-1.2.3.zip,
#   passauth-extension-firefox-1.2.3.zip + -source) are kept as downloads on the workflow run for 90 days. The version comes from extension/package.json and
#   extension/public/manifest.json, which must both match the tag (the Web Store needs a higher
#   manifest version for every upload).
# - Run it by hand (Actions → Extension → Run workflow) to only check the store connections:
#   it signs in to the Chrome Web Store and addons.mozilla.org and prints their status; nothing
#   is built or uploaded.
name: Extension

on:
  push:
    branches: [main]
    tags: ["extension-[0-9]*.*.*"]
    paths:
      - "web/**"
      - "extension/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/build-wasm.sh"
      - "testdata/**"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "web/**"
      - "extension/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/build-wasm.sh"
      - "testdata/**"
      - ".github/workflows/extension.yml"
  workflow_dispatch:

permissions:
  contents: read

# Check runs on a branch replace each other; a tag run (release) is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-manual' || '' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  clients:
    name: web vault + extension
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-bindgen CLI (version from Cargo.lock)
        run: |
          v="$(grep -A3 'name = "wasm-bindgen"' Cargo.lock | grep -m1 version | cut -d'"' -f2)"
          cargo install wasm-bindgen-cli --version "$v" --locked
      # The extension's packageManager field (extension/package.json) names the same pnpm.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: scripts/build-wasm.sh web/src/wasm extension/src/wasm
      - name: Web vault (build, unit tests)
        run: pnpm install --frozen-lockfile && pnpm build && pnpm test
        working-directory: web
      # The browser build above is the core the vectors must come from (no second build).
      - name: Golden vectors match the core
        run: node testdata/generate-vectors.mjs --check --wasm extension/src/wasm
      - name: Extension (lint, unit tests, type check + build)
        run: pnpm install --frozen-lockfile && pnpm lint && pnpm test && pnpm build
        working-directory: extension
      # Fails on lint errors only (its warnings are known: fixed innerHTML markup, the Chrome-only offscreen path).
      - name: Firefox extension (build + web-ext lint)
        run: pnpm build:firefox && npm exec --yes -- web-ext@10.8.0 lint --source-dir dist-firefox
        working-directory: extension
      # The desktop app embeds it (desktop.yml).
      - name: Safari extension (build)
        run: pnpm build:safari
        working-directory: extension

  store-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the Chrome Web Store connection
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: scripts/cws-publish.sh --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Check the addons.mozilla.org connection
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/amo-check.mjs

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#extension-}"
          pkg="$(node -p "require('./extension/package.json').version")"
          manifest="$(node -p "require('./extension/public/manifest.json').version")"
          [ "${tag%%-*}" = "$pkg" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match extension/package.json $pkg"; exit 1; }
          [ "$pkg" = "$manifest" ] || { echo "::error::manifest.json version $manifest differs from package.json $pkg"; exit 1; }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI
        run: |
          v="$(grep -A3 'name = "wasm-bindgen"' Cargo.lock | grep -m1 version | cut -d'"' -f2)"
          cargo install wasm-bindgen-cli --version "$v" --locked
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # pnpm package: a reproducible zip (fixed file times, sorted entries, zip -X; extension/package.mjs).
      - name: Build Chrome extension
        run: |
          # The extension reuses web vault components, which import the web copy of the core.
          scripts/build-wasm.sh web/src/wasm
          scripts/build-wasm.sh extension/src/wasm
          cd extension
          pnpm install --frozen-lockfile
          pnpm package
          mv passauth-extension.zip "../passauth-extension-${GITHUB_REF_NAME#extension-}.zip"
      # Same code, Firefox manifest (extension/firefox-manifest.mjs); the source archive is what AMO's
      # reviewers rebuild from (byte-identical output: scripts/build-wasm.sh maps machine paths away).
      - name: Build Firefox extension + source archive
        run: |
          v="${GITHUB_REF_NAME#extension-}"
          (cd extension && pnpm package:firefox && mv passauth-extension-firefox.zip "../passauth-extension-firefox-$v.zip")
          scripts/firefox-source.sh "passauth-extension-firefox-$v-source.zip" "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passauth-extension-${{ github.ref_name }}
          path: passauth-extension-*.zip
          if-no-files-found: error
      # Off until repo variable CWS_UPLOAD_ENABLED=true (plus CWS_PUBLISHER_ID, CWS_ITEM_ID and
      # secret CWS_SERVICE_ACCOUNT_JSON). Pre-releases (X.Y.Z-beta) are only built (zip on the run).
      - name: Submit to the Chrome Web Store
        if: vars.CWS_UPLOAD_ENABLED == 'true'
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: |
          # Check the version, not the tag: every tag contains "-" (extension-...).
          v="${GITHUB_REF_NAME#extension-}"
          if [[ "$v" == *-* ]]; then echo "Pre-release $v: not sent to the Web Store"; exit 0; fi
          scripts/cws-publish.sh "passauth-extension-$v.zip"
      # Off until repo variable AMO_UPLOAD_ENABLED=true (plus secrets AMO_JWT_ISSUER, AMO_JWT_SECRET).
      # The first upload creates the listing from extension/amo-metadata.json. --approval-timeout 0:
      # return once AMO has validated the upload (review can take days); the listing updates after approval.
      - name: Submit to addons.mozilla.org
        if: vars.AMO_UPLOAD_ENABLED == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        working-directory: extension
        run: |
          v="${GITHUB_REF_NAME#extension-}"
          if [[ "$v" == *-* ]]; then echo "Pre-release $v: not sent to addons.mozilla.org"; exit 0; fi
          npm exec --yes -- web-ext@10.8.0 sign --source-dir dist-firefox --channel listed \
            --amo-metadata amo-metadata.json --upload-source-code "../passauth-extension-firefox-$v-source.zip" \
            --approval-timeout 0 --artifacts-dir "$RUNNER_TEMP/web-ext"
