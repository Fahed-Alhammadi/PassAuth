name: Extension release

# Push a tag like extension-1.2.3 (scripts/release.sh extension 1.2.3) to build the Chrome
# extension, publish passauth-extension-1.2.3.zip as a GitHub release and submit it to the
# Chrome Web Store. The version comes from extension/package.json and
# extension/public/manifest.json, which must both match the tag (the Web Store needs a higher
# manifest version for every upload).
# Run it by hand (Actions → Extension release → Run workflow) to only check the Web Store
# connection: it signs in and prints the store status; nothing is built or uploaded.
on:
  push:
    tags: ["extension-[0-9]*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  store-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the Chrome Web Store connection
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: scripts/cws-publish.sh --check

  github-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#extension-}"
          pkg="$(node -p "require('./extension/package.json').version")"
          manifest="$(node -p "require('./extension/public/manifest.json').version")"
          [ "${tag%%-*}" = "$pkg" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match extension/package.json $pkg"; exit 1; }
          [ "$pkg" = "$manifest" ] || { echo "::error::manifest.json version $manifest differs from package.json $pkg"; exit 1; }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI
        run: |
          v="$(grep -A3 'name = "wasm-bindgen"' Cargo.lock | grep -m1 version | cut -d'"' -f2)"
          cargo install wasm-bindgen-cli --version "$v" --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Build Chrome extension
        run: |
          # The extension reuses web vault components, which import the web copy of the core.
          scripts/build-wasm.sh web/src/wasm
          scripts/build-wasm.sh extension/src/wasm
          cd extension
          pnpm install --frozen-lockfile
          pnpm package
          mv passauth-extension.zip "../passauth-extension-${GITHUB_REF_NAME#extension-}.zip"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#extension-}"
          pre=()
          [[ "$v" == *-* ]] && pre=(--prerelease)
          # Own notes: --generate-notes would diff against the newest release of any part.
          # Never "Latest": that badge belongs to the server release; users install from the store.
          scripts/release-notes.sh "$GITHUB_REF_NAME" \
            extension web/src crates/core crates/core-wasm > notes.md
          gh release create "$GITHUB_REF_NAME" --latest=false --notes-file notes.md \
            --title "PassAuth extension v$v" \
            "passauth-extension-$v.zip" "${pre[@]}"
      # Off until repo variable CWS_UPLOAD_ENABLED=true (plus CWS_PUBLISHER_ID, CWS_ITEM_ID and
      # secret CWS_SERVICE_ACCOUNT_JSON). Pre-releases (X.Y.Z-beta) stay on GitHub only.
      - name: Submit to the Chrome Web Store
        if: vars.CWS_UPLOAD_ENABLED == 'true'
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: |
          # Check the version, not the tag: every tag contains "-" (extension-...).
          v="${GITHUB_REF_NAME#extension-}"
          if [[ "$v" == *-* ]]; then echo "Pre-release $v: not sent to the Web Store"; exit 0; fi
          scripts/cws-publish.sh "passauth-extension-$v.zip"
