name: Server release

# Push a tag like server-v1.2.3 (scripts/release.sh server 1.2.3) to publish the server +
# web vault image: ghcr.io/fahed-alhammadi/passauth:1.2.3 and :latest.
# Every release moves :latest, so `docker compose pull` with PASSAUTH_VERSION=latest
# always gets the newest version. Pre-release tags (server-v1.2.3-rc.1) don't move :latest.
# The extension and the apps have their own versions and tags (extension.yml, ios.yml, android.yml).
on:
  push:
    tags: ["server-v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match the tag
        id: v
        run: |
          tag="${GITHUB_REF_NAME#server-v}"
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          web="$(node -p "require('./web/package.json').version")"
          [ "${tag%%-*}" = "$crate" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"; exit 1; }
          [ "$crate" = "$web" ] || { echo "::error::web/package.json version $web differs from Cargo.toml $crate"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/passauth
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.v.outputs.version, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

