# Desktop app (Tauri, reuses web/src) + its macOS AutoFill extension (reuses ios/Shared).
# - Push to main / pull request: checks the desktop app (typecheck, frontend build, clippy),
#   audits desktop/src-tauri and runs the macOS AutoFill extension unit tests, when the desktop
#   app or code it is built from changes.
# Release: builds the desktop app (Tauri) for macOS, Windows and Linux.
# - Push a tag vX.Y.Z (scripts/release.sh desktop X.Y.Z; version in desktop/package.json and
#   desktop/src-tauri/Cargo.toml): builds all three and creates the GitHub release "PassAuth X.Y.Z",
#   marked Latest, with the installers, the updater files (*.sig, latest.json) and fixed-name copies
#   of the installers (PassAuth-macOS.dmg, ...) that the README and the website link to. Installed
#   apps update from releases/latest/download/latest.json. A pre-release tag (vX.Y.Z-beta.1, made
#   by hand with the files at X.Y.Z) gets a pre-release without latest.json, so no app updates to it.
# - "Run workflow" (manual): builds only; the bundles are kept on the run as artifacts.
# macOS: signed and notarized when APPLE_CERTIFICATE (base64 Developer ID Application .p12) and
# APPLE_CERTIFICATE_PASSWORD are set; notarization uses the App Store Connect API key from ios.yml
# (APP_STORE_CONNECT_API_KEY_ID / _API_ISSUER_ID / _API_KEY_P8). Without the certificate the app
# is built unsigned and Gatekeeper warns on first open (Control-click → Open).
# Windows: unsigned for now; SmartScreen warns until a code-signing certificate is added.
# Updater signatures: TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD when the key
# has one; empty otherwise). The matching public key is in desktop/src-tauri/tauri.conf.json.
name: Desktop

on:
  push:
    branches: [main]
    tags: ["v[0-9]*.*.*"]
    paths:
      - "desktop/**"
      - "web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/build-wasm.sh"
      - "scripts/build-macos-core.sh"
      - "ios/Shared/**"
      - "ios/AutoFill/**"
      - "ios/UI/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/build-wasm.sh"
      - "scripts/build-macos-core.sh"
      - "ios/Shared/**"
      - "ios/AutoFill/**"
      - "ios/UI/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

# Check runs on a branch replace each other; a tag run (release) is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-manual' || '' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: desktop app
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The root workspace builds the core for the browser; the app is its own workspace.
          workspaces: |
            .
            desktop/src-tauri
      - name: Install wasm-bindgen CLI (version from Cargo.lock)
        run: |
          v="$(grep -A3 'name = "wasm-bindgen"' Cargo.lock | grep -m1 version | cut -d'"' -f2)"
          cargo install wasm-bindgen-cli --version "$v" --locked
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: scripts/build-wasm.sh web/src/wasm
      # The desktop app imports web/src, whose imports resolve from web/node_modules.
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm build
        working-directory: desktop
      # The Rust shell embeds the built frontend, so it is checked after `pnpm build`.
      - run: cargo fmt --all --check && cargo clippy --all-targets --locked -- -D warnings
        working-directory: desktop/src-tauri

  # The desktop app is its own Cargo workspace with its own lockfile.
  audit:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: desktop/src-tauri

  autofill:
    name: macOS AutoFill extension
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Unit tests
        run: |
          scripts/build-macos-core.sh
          cd desktop/macos && xcodegen generate
          xcodebuild -project PassAuthAutoFill.xcodeproj -scheme PassAuthAutoFill -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO test -quiet

  build:
    name: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            targets: wasm32-unknown-unknown
          - os: ubuntu-22.04
            args: ""
            targets: wasm32-unknown-unknown
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check versions match the tag
        id: v
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./desktop/package.json').version")"
          crate="$(awk '/^\[package\]/{s=1;next} /^\[/{s=0} s && /^version *=/{gsub(/[" ]/,"");sub(/version=/,"");print;exit}' desktop/src-tauri/Cargo.toml)"
          [ "${tag%%-*}" = "$pkg" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match desktop/package.json version $pkg"; exit 1; }
          [ "$pkg" = "$crate" ] || { echo "::error::desktop/src-tauri/Cargo.toml version $crate differs from desktop/package.json $pkg"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      # Changes since the previous desktop tag, plus which file is for which system. The bundle
      # names carry the version from Cargo.toml (the tag without a pre-release suffix).
      - name: Release notes
        id: notes
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          v="${VERSION%%-*}"
          # A random delimiter, so no line of the notes can end the output block early.
          eof="NOTES-$(openssl rand -hex 16)"
          {
            echo "body<<$eof"
            scripts/release-notes.sh "$GITHUB_REF_NAME" desktop web/src crates/core crates/core-wasm
            echo
            echo '## Downloads'
            echo
            echo "- macOS (Apple silicon and Intel): \`PassAuth_${v}_universal.dmg\`"
            echo "- Windows (64-bit): \`PassAuth_${v}_x64-setup.exe\`"
            echo "- Linux (x86_64): \`PassAuth_${v}_amd64.AppImage\` runs on any distribution; \`PassAuth_${v}_amd64.deb\` for Debian and Ubuntu, \`PassAuth-${v}-1.x86_64.rpm\` for Fedora and openSUSE"
            echo
            echo "The installed app checks here for new versions and asks before updating. The other files (\`latest.json\`, \`*.sig\`, \`*.app.tar.gz\`) are for that updater."
            echo "$eof"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The root workspace builds the core for the browser; the app is its own workspace.
          workspaces: |
            .
            desktop/src-tauri
      - name: Install wasm-bindgen CLI (version from Cargo.lock)
        run: |
          v="$(grep -A3 'name = "wasm-bindgen"' Cargo.lock | grep -m1 version | cut -d'"' -f2)"
          cargo install wasm-bindgen-cli --version "$v" --locked
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Build the core for the browser
        run: scripts/build-wasm.sh web/src/wasm
      # The desktop app imports web/src, whose imports resolve from web/node_modules.
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: desktop

      # Developer ID certificate into a temporary keychain (as ios.yml does) and the App Store
      # Connect API key for notarization; Tauri picks both up from the environment. Skipped
      # (unsigned build) while APPLE_CERTIFICATE is not set.
      - name: macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::notice::APPLE_CERTIFICATE is not set: the macOS app is built unsigned (Gatekeeper warns on first open)"
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(uuidgen)"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" > /dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          security find-identity -v -p codesigning "$kc"
          echo "SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=Developer ID Application: Fahed Alhammadi (JEXQBK3SQ5)" >> "$GITHUB_ENV"
          if [ -z "$KEY_P8" ]; then
            echo "::warning::APP_STORE_CONNECT_API_KEY_P8 is not set: the macOS app is signed but not notarized"
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$KEY_P8" > "$key"
          {
            echo "APPLE_API_KEY=$KEY_ID"
            echo "APPLE_API_ISSUER=$ISSUER_ID"
            echo "APPLE_API_KEY_PATH=$key"
          } >> "$GITHUB_ENV"

      # macOS AutoFill extension (desktop/macos): built, signed with its own entitlements and the
      # Developer ID provisioning profile, then copied into PassAuth.app/Contents/PlugIns by Tauri
      # (bundle.macOS.files, CI-only config). Tauri signs the outer app without --deep, so the
      # extension keeps its signature. macOS lists a credential provider only when its containing
      # app carries the AutoFill entitlement too, so the app is signed with
      # entitlements/macos-host.plist and its own Developer ID profile (Contents/embedded.provisionprofile,
      # secret MACOS_DESKTOP_PROVISIONING_PROFILE). Skipped (no extension) while a secret is missing.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        if: runner.os == 'macOS'
        with:
          xcode-version: latest-stable
      - name: macOS AutoFill extension
        if: runner.os == 'macOS'
        env:
          PROFILE_BASE64: ${{ secrets.MACOS_AUTOFILL_PROVISIONING_PROFILE }}
          HOST_PROFILE_BASE64: ${{ secrets.MACOS_DESKTOP_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$PROFILE_BASE64" ] || [ -z "$HOST_PROFILE_BASE64" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::warning::MACOS_AUTOFILL_PROVISIONING_PROFILE, MACOS_DESKTOP_PROVISIONING_PROFILE or the signing certificate is missing: the macOS app is built without AutoFill"
            exit 0
          fi
          brew install xcodegen
          profile="$RUNNER_TEMP/autofill.provisionprofile"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile"
          MACOS_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" MACOS_SIGN_KEYCHAIN="$SIGNING_KEYCHAIN" MACOS_AUTOFILL_PROFILE="$profile" desktop/macos/build.sh
          appex="$GITHUB_WORKSPACE/desktop/macos/build/PassAuthAutoFill.appex"
          codesign --verify --strict --verbose=2 "$appex"
          host_profile="$RUNNER_TEMP/desktop.provisionprofile"
          printf '%s' "$HOST_PROFILE_BASE64" | base64 --decode > "$host_profile"
          entitlements="$GITHUB_WORKSPACE/desktop/src-tauri/entitlements/macos-host.plist"
          printf '{"bundle":{"macOS":{"entitlements":"%s","files":{"PlugIns/PassAuthAutoFill.appex":"%s","embedded.provisionprofile":"%s"}}}}' \
            "$entitlements" "$appex" "$host_profile" > "$RUNNER_TEMP/autofill.json"
          echo "AUTOFILL_ARGS=--config $RUNNER_TEMP/autofill.json" >> "$GITHUB_ENV"
      # Tag push: builds, then creates the release (or adds to it: the three systems share one)
      # and uploads the bundles, their updater signatures and latest.json (not for pre-releases).
      # Manual run: builds and keeps the bundles on the run.
      - name: Build (and release)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }} ${{ env.AUTOFILL_ARGS }}
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Check the AutoFill extension is inside the signed app
        if: runner.os == 'macOS' && env.AUTOFILL_ARGS != ''
        run: |
          app="desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/PassAuth.app"
          appex="$app/Contents/PlugIns/PassAuthAutoFill.appex"
          test -d "$appex"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$appex" 2>/dev/null | grep -q autofill-credential-provider
          # The containing app: AutoFill entitlement + the profile that allows it (or macOS kills it at launch).
          codesign -d --entitlements - "$app" 2>/dev/null | grep -q autofill-credential-provider
          test -f "$app/Contents/embedded.provisionprofile"

      - name: Remove the API key and keychain
        if: always() && runner.os == 'macOS'
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          [ -z "${SIGNING_KEYCHAIN:-}" ] || security delete-keychain "$SIGNING_KEYCHAIN" || true

  # Fixed-name copies of the installers on the same release, so the README and the website can
  # link https://github.com/<repo>/releases/latest/download/PassAuth-macOS.dmg and so on.
  fixed-names:
    name: fixed-name downloads
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Copy each installer under its fixed name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # copy <glob of the versioned asset> <fixed name>: exactly one asset must match.
          copy() {
            rm -rf dl && mkdir dl
            gh release download "$GITHUB_REF_NAME" --pattern "$1" --dir dl
            [ "$(find dl -type f | wc -l)" -eq 1 ] || { echo "::error::expected one release asset matching $1, found: $(ls dl)"; exit 1; }
            mv dl/* "$2"
            gh release upload "$GITHUB_REF_NAME" "$2" --clobber
          }
          copy 'PassAuth_*_universal.dmg' PassAuth-macOS.dmg
          copy 'PassAuth_*_x64-setup.exe' PassAuth-Windows-x64-setup.exe
          copy 'PassAuth_*_amd64.AppImage' PassAuth-Linux-x86_64.AppImage
          copy 'PassAuth_*_amd64.deb' PassAuth-Linux-amd64.deb
          copy 'PassAuth-[0-9]*.x86_64.rpm' PassAuth-Linux-x86_64.rpm
