# PassAuth for Safari (safari/): its own App Store app (iPhone, iPad and Mac) carrying the browser extension's
# Safari build (extension/, `pnpm build:safari`). Push/PR: build both platforms unsigned. Tag safari-X.Y.Z
# (scripts/release.sh safari X.Y.Z) or a manual run: archive both platforms; the tag (or upload=true) uploads them to
# App Store Connect (TestFlight) with "What to Test" from safari/whatsnew/en-US.txt.
name: safari

on:
  push:
    branches: [main]
    tags: ["safari-[0-9]*.*.*"]
    paths:
      - "safari/**"
      - "extension/**"
      - "web/src/**"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - "crates/core/**"
      - "crates/core-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/build-wasm.sh"
      - "scripts/testflight-notes.py"
      - ".github/workflows/safari.yml"
  pull_request:
    paths:
      - "safari/**"
      - "extension/**"
      - "web/src/**"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - "crates/core/**"
      - "crates/core-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/build-wasm.sh"
      - "scripts/testflight-notes.py"
      - ".github/workflows/safari.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: Also upload to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

# Check runs on a branch replace each other; a tag run (release) is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-manual' || '' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: safari app
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    # Apple requires the iOS 27 SDK (Xcode 27) for uploads from April 2027 (ITMS-90725): the xcode-27 image.
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '^27.0'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-bindgen CLI (version from Cargo.lock) and XcodeGen
        run: |
          v="$(grep -A3 'name = "wasm-bindgen"' Cargo.lock | grep -m1 version | cut -d'"' -f2)"
          cargo install wasm-bindgen-cli --version "$v" --locked
          brew install xcodegen
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Safari build of the extension
        run: |
          scripts/build-wasm.sh web/src/wasm extension/src/wasm
          (cd web && pnpm install --frozen-lockfile)
          (cd extension && pnpm install --frozen-lockfile && pnpm build:safari)
      - name: Build (iOS simulator and macOS, unsigned)
        run: |
          cd safari && xcodegen generate
          for dest in 'generic/platform=iOS Simulator' 'generic/platform=macOS'; do
            xcodebuild -project PassAuthSafari.xcodeproj -scheme PassAuthSafari -destination "$dest" \
              CODE_SIGNING_ALLOWED=NO build -quiet
          done

  archive:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check safari/VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#safari-}"
          app="$(tr -d '[:space:]' < safari/VERSION)"
          [ "$tag" = "$app" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match safari/VERSION $app"; exit 1; }

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '^27.0'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-bindgen CLI (version from Cargo.lock) and XcodeGen
        run: |
          v="$(grep -A3 'name = "wasm-bindgen"' Cargo.lock | grep -m1 version | cut -d'"' -f2)"
          cargo install wasm-bindgen-cli --version "$v" --locked
          brew install xcodegen
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Safari build of the extension
        run: |
          scripts/build-wasm.sh web/src/wasm extension/src/wasm
          (cd web && pnpm install --frozen-lockfile)
          (cd extension && pnpm install --frozen-lockfile && pnpm build:safari)
      - name: Generate the Xcode project
        run: cd safari && xcodegen generate

      - name: API key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # The existing Apple Development certificate (also used by ios.yml), so a run doesn't create a new one.
      - name: Development certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DEV_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          [ -n "$P12_BASE64" ] || { echo "::error::IOS_DEV_CERT_P12_BASE64 is not set"; exit 1; }
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(uuidgen)"
          p12="$RUNNER_TEMP/dev.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" > /dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          security find-identity -v -p codesigning "$kc"
          echo "SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Archive (iOS and macOS)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        # Automatic signing, as ios.yml: the export re-signs for the App Store. Without
        # -allowProvisioningDeviceRegistration no runner is registered as a device: the macOS development profile
        # lists the team's registered Mac(s), which is enough to sign an archive.
        run: |
          set -o pipefail
          for platform in iOS macOS; do
            xcodebuild -project safari/PassAuthSafari.xcodeproj -scheme PassAuthSafari -configuration Release \
              -destination "generic/platform=$platform" -archivePath "$RUNNER_TEMP/PassAuthSafari-$platform.xcarchive" \
              -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              archive | tail -40
          done

      - name: Upload to App Store Connect
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          for platform in iOS macOS; do
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PassAuthSafari-$platform.xcarchive" \
              -exportOptionsPlist safari/ExportOptions.plist -exportPath "$RUNNER_TEMP/export-$platform" \
              -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          done

      # TestFlight "What to Test" for both builds (waits for App Store Connect to list them). A failure here leaves
      # the uploads in place: add the notes in App Store Connect.
      - name: TestFlight notes (What to Test)
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload
        continue-on-error: true
        timeout-minutes: 45
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          BUNDLE_ID: io.passauth.safari
        run: |
          info="$RUNNER_TEMP/PassAuthSafari-iOS.xcarchive/Info.plist"
          version=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$info")
          build=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' "$info")
          python3 -m venv "$RUNNER_TEMP/notes-venv"
          "$RUNNER_TEMP/notes-venv/bin/pip" install --quiet "pyjwt[crypto]==2.10.1"
          ok=true
          for platform in IOS MAC_OS; do
            PLATFORM=$platform "$RUNNER_TEMP/notes-venv/bin/python" scripts/testflight-notes.py "$version" "$build" safari/whatsnew/en-US.txt || ok=false
          done
          $ok || { echo "::warning::TestFlight notes were not set; add them in App Store Connect"; exit 1; }

      - name: Remove the API key and keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          [ -z "$SIGNING_KEYCHAIN" ] || security delete-keychain "$SIGNING_KEYCHAIN" || true
