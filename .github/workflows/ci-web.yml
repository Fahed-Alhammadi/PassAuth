# Web vault + Chrome extension: build (and extension tests) against the browser build of the core.
name: CI web + extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "extension/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/build-wasm.sh"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "web/**"
      - "extension/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/build-wasm.sh"
      - ".github/workflows/ci-web.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  clients:
    name: web vault + extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-bindgen CLI (version from Cargo.lock)
        run: |
          v="$(grep -A3 'name = "wasm-bindgen"' Cargo.lock | grep -m1 version | cut -d'"' -f2)"
          cargo install wasm-bindgen-cli --version "$v" --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: scripts/build-wasm.sh web/src/wasm extension/src/wasm
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: web
      - run: pnpm install --frozen-lockfile && pnpm build && pnpm test
        working-directory: extension
