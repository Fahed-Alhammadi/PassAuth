name: Android

# Builds the signed Android App Bundle.
# - Push a tag vX.Y.Z (same tag as the server release): uploads it to Google Play's
#   internal testing track, once the repository variable PLAY_UPLOAD_ENABLED is "true"
#   (Play only accepts API uploads after the app's first bundle was uploaded by hand).
# - "Run workflow" (manual): builds the bundle as a downloadable artifact only, e.g.
#   for that first manual upload.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cargo version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          [ "$tag" = "$crate" ] || { echo "::error::Tag v$tag does not match workspace version $crate"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager --install "ndk;29.0.14206865" >/dev/null && echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the core for Android
        run: scripts/build-android-core.sh

      - name: Signed release bundle
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          export ANDROID_UPLOAD_KEYSTORE_PATH="$ks"
          cd android && ./gradlew --no-daemon :app:testReleaseUnitTest :app:bundleRelease
          rm -f "$ks"
          mv app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/passauth-${GITHUB_REF_NAME//\//-}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: passauth-android-${{ github.ref_name }}
          path: ${{ runner.temp }}/passauth-*.aab
          if-no-files-found: error

      - name: Upload to Google Play (internal testing)
        if: startsWith(github.ref, 'refs/tags/') && vars.PLAY_UPLOAD_ENABLED == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.passauth.app
          releaseFiles: ${{ runner.temp }}/passauth-*.aab
          track: internal
          status: completed
