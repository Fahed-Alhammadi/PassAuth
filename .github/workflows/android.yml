# Android app with the Rust core (UniFFI).
# - Push to main / pull request: debug build + unit tests, when the Android app or the core changes.
# - Push a tag android-X.Y.Z (scripts/release.sh android X.Y.Z; version in android/VERSION):
#   builds the signed Android App Bundle and uploads it to Google Play, once the repository
#   variable PLAY_UPLOAD_ENABLED is "true"
#   (Play only accepts API uploads after the app's first bundle was uploaded by hand).
#   Track = repository variable PLAY_TRACK ("internal" when unset; "alpha" = closed testing),
#   release status = PLAY_RELEASE_STATUS ("completed" when unset; "draft" until the app is published).
# - "Run workflow" (manual): builds the bundle as a downloadable artifact; tick "upload"
#   to also send it to Play (e.g. to re-send a release after a CI fix), on the chosen track.
name: Android

on:
  push:
    branches: [main]
    tags: ["android-[0-9]*.*.*"]
    paths:
      - "android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/build-android-core.sh"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/build-android-core.sh"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: Also upload to Google Play
        type: boolean
        default: false
      track:
        description: Play track (empty = repository variable PLAY_TRACK, else internal; alpha = closed testing)
        type: string
        default: ""

permissions:
  contents: read

# Check runs on a branch replace each other; a tag run (release) is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-manual' || '' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: android app
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The default also installs the retired "tools" package, which no longer exists.
          packages: platform-tools
      - name: Install NDK
        run: sdkmanager --install "ndk;29.0.14206865" >/dev/null && echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: cargo-ndk
          # Build it from crates.io when GitHub release downloads fail (seen during outages).
          fallback: cargo-install
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test (debug)
        run: |
          PROFILE=debug scripts/build-android-core.sh
          cd android && ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

  bundle:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check android/VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#android-}"
          app="$(tr -d '[:space:]' < android/VERSION)"
          [ "$tag" = "$app" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match android/VERSION $app"; exit 1; }

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The default also installs the retired "tools" package, which no longer exists.
          packages: platform-tools
      - name: Install NDK
        run: sdkmanager --install "ndk;29.0.14206865" >/dev/null && echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: cargo-ndk
          # Build it from crates.io when GitHub release downloads fail (seen during outages).
          fallback: cargo-install
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the core for Android
        run: scripts/build-android-core.sh

      - name: Signed release bundle
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          export ANDROID_UPLOAD_KEYSTORE_PATH="$ks"
          cd android && ./gradlew --no-daemon :app:bundleRelease
          rm -f "$ks"
          mv app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/passauth-${GITHUB_REF_NAME//\//-}.aab"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passauth-android-${{ github.ref_name }}
          path: ${{ runner.temp }}/passauth-*.aab
          if-no-files-found: error

      - name: Upload to Google Play (${{ inputs.track || vars.PLAY_TRACK || 'internal' }})
        if: (startsWith(github.ref, 'refs/tags/') || inputs.upload) && vars.PLAY_UPLOAD_ENABLED == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.passauth.app
          releaseFiles: ${{ runner.temp }}/passauth-*.aab
          track: ${{ inputs.track || vars.PLAY_TRACK || 'internal' }}
          # Release notes ("What's new"): android/whatsnew/whatsnew-en-US (max 500 characters).
          whatsNewDirectory: android/whatsnew
          # "draft" while the app has never been published (Play refuses anything else then);
          # the draft is rolled out in Play Console. Unset = completed.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
