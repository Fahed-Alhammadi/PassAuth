# iOS app + AutoFill extension with the Rust core (UniFFI).
# - Push to main / pull request: simulator build (unsigned), when the iOS app or the core changes.
#   Unit and UI tests run locally (see ARCHITECTURE.md).
# - Push a tag ios-X.Y.Z (scripts/release.sh ios X.Y.Z; version in ios/VERSION): archives the
#   signed app and uploads it to App Store Connect (TestFlight).
# - "Run workflow" (manual): archives only; tick "upload" to also send it to TestFlight.
# Signing is automatic with the App Store Connect API key in
# APP_STORE_CONNECT_API_KEY_ID / _ISSUER_ID / _KEY_P8 (an Admin key: Xcode manages the
# profiles for io.passauth.app and io.passauth.app.autofill itself). The archive is signed
# with the existing Apple Development certificate from IOS_DEV_CERT_P12_BASE64 /
# IOS_DEV_CERT_PASSWORD; without it every run would create a new development certificate
# (team limit). The upload is re-signed with the cloud-managed distribution certificate.
name: iOS

on:
  push:
    branches: [main]
    tags: ["ios-[0-9]*.*.*"]
    paths:
      - "ios/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/build-ios-core.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/build-ios-core.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: Also upload to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

# Check runs on a branch replace each other; a tag run (release) is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-manual' || '' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ios:
    name: ios app
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build (simulator, unsigned)
        run: |
          scripts/build-ios-core.sh
          cd ios && xcodegen generate
          xcodebuild -project PassAuth.xcodeproj -scheme PassAuth -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build -quiet

  archive:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check ios/VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#ios-}"
          app="$(tr -d '[:space:]' < ios/VERSION)"
          [ "$tag" = "$app" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match ios/VERSION $app"; exit 1; }

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the core for iOS
        run: scripts/build-ios-core.sh

      - name: Generate the Xcode project
        run: cd ios && xcodegen generate

      - name: API key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Development certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DEV_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          [ -n "$P12_BASE64" ] || { echo "::error::IOS_DEV_CERT_P12_BASE64 is not set"; exit 1; }
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(uuidgen)"
          p12="$RUNNER_TEMP/dev.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" > /dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          security find-identity -v -p codesigning "$kc"
          echo "SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild -project ios/PassAuth.xcodeproj -scheme PassAuth -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PassAuth.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -40

      - name: Upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PassAuth.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # TestFlight "What to Test" from ios/whatsnew/en-US.txt (waits for App Store Connect to list
      # the build). A failure here leaves the upload in place: add the notes in App Store Connect.
      - name: TestFlight notes (What to Test)
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload
        continue-on-error: true
        timeout-minutes: 45
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          info="$RUNNER_TEMP/PassAuth.xcarchive/Info.plist"
          version=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$info")
          build=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' "$info")
          python3 -m venv "$RUNNER_TEMP/notes-venv"
          "$RUNNER_TEMP/notes-venv/bin/pip" install --quiet "pyjwt[crypto]==2.10.1"
          "$RUNNER_TEMP/notes-venv/bin/python" scripts/testflight-notes.py "$version" "$build" ios/whatsnew/en-US.txt \
            || { echo "::warning::TestFlight notes were not set; add them in App Store Connect"; exit 1; }

      - name: Remove the API key and keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          [ -z "$SIGNING_KEYCHAIN" ] || security delete-keychain "$SIGNING_KEYCHAIN" || true
