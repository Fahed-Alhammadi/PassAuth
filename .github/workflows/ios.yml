name: iOS

# Builds the signed iOS app and uploads it to App Store Connect (TestFlight).
# - Push a tag vX.Y.Z (same tag as the server release): archives and uploads.
# - "Run workflow" (manual): archives only; tick "upload" to also send it to TestFlight.
# Signing is automatic (cloud-managed certificates) with the App Store Connect API key in
# APP_STORE_CONNECT_API_KEY_ID / _ISSUER_ID / _KEY_P8 (an Admin key: Xcode creates the
# certificates and profiles for io.passauth.app and io.passauth.app.autofill itself).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      upload:
        description: Also upload to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check Cargo version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          [ "$tag" = "$crate" ] || { echo "::error::Tag v$tag does not match workspace version $crate"; exit 1; }

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the core for iOS
        run: scripts/build-ios-core.sh

      - name: Generate the Xcode project
        run: cd ios && xcodegen generate

      - name: API key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild -project ios/PassAuth.xcodeproj -scheme PassAuth -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PassAuth.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -40

      - name: Upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PassAuth.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
