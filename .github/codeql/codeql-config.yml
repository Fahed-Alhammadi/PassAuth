# CodeQL settings for .github/workflows/codeql.yml.
# Test code and vendored third-party code are not scanned (test passwords and keys are
# reported as hard-coded secrets). paths-ignore applies to languages scanned without a build
# (Rust, JavaScript/TypeScript, Python, Actions); Swift and Kotlin scan what the build compiles.
name: PassAuth CodeQL

paths-ignore:
  - crates/server/src/tests.rs
  - crates/vendor/**
  - "**/test/**"
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.test.mjs"
