# PassAuth for Safari: its own App Store app (iPhone, iPad and Mac; one record, universal purchase)
# that carries the PassAuth Safari extension. Generate the Xcode project with:
#   (cd ../extension && pnpm build:safari) && xcodegen generate
# (PassAuthSafari.xcodeproj and Version.xcconfig are generated and not committed.)
name: PassAuthSafari
options:
  bundleIdPrefix: io.passauth
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  preGenCommand: scripts/version.sh
configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: JEXQBK3SQ5
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES

# The app and its extension, once per platform (same bundle ids on both = one App Store app).
targets:
  PassAuthSafari:
    type: application
    supportedDestinations: [iOS, macOS]
    platform: auto
    sources:
      - path: App
    dependencies:
      - target: SafariExtension
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PassAuth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/PassAuthSafari.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.passauth.safari
        PRODUCT_NAME: PassAuth for Safari
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  # The Safari web extension: the browser extension's code (extension/, built by
  # `pnpm build:safari` into extension/dist-safari and copied in by the build phase below)
  # plus a small native handler for runtime.sendNativeMessage. Passkeys stay with the AutoFill
  # extensions of the PassAuth apps (not in the Safari manifest).
  SafariExtension:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    platform: auto
    sources:
      - path: Extension
    postCompileScripts:
      - name: Copy the Safari build of the extension
        script: scripts/copy-safari-extension.sh
        basedOnDependencyAnalysis: false
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: PassAuth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extension/SafariExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.passauth.safari.extension
        PRODUCT_NAME: SafariExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        # The build phase reads extension/dist-safari outside the project's declared inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  PassAuthSafari:
    build:
      targets:
        PassAuthSafari: all
    archive:
      config: Release
