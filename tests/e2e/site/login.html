<!doctype html><html><body>
<h1>Example login</h1>
<form id="f" action="/done.html" method="get" onsubmit="event.preventDefault(); document.getElementById('status').textContent='submitted';">
  <input id="user" name="username" type="text" autocomplete="username" placeholder="Email">
  <input id="pass" name="password" type="password" autocomplete="current-password">
  <button type="submit">Sign in</button>
</form>
<p id="status"></p>
</body></html>
