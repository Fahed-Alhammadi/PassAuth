[package]
name = "passauth-core-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Kotlin and Swift bindings (UniFFI) for the PassAuth core"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "passauth_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
passauth-core = { path = "../core" }
serde = "1.0.229"
serde_json = "1.0.154"
uniffi = "0.32.2"
