[package]
name = "passauth-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rand_core06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
anyhow = "1.0.104"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
dashmap = "6.2.1"
futures-util = "0.3.34"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls", "smtp-transport", "builder", "hostname", "ring", "webpki-roots"] }
passauth-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "any", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "set-header", "limit", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
passauth-core = { path = "../core", features = ["insecure-test-kdf"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
