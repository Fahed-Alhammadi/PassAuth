[package]
name = "passauth-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rand_core06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
sha2_v10 = { package = "sha2", version = "0.10" }
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
data-encoding = "2.11.1"
getrandom = "0.3"
hkdf = "0.13.0"
hmac = "0.13.0"
opaque-ke = { version = "4.0.1", features = ["ristretto255"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"

[features]
insecure-test-kdf = []
