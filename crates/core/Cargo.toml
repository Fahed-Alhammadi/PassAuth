[package]
name = "passauth-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rand_core06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
sha2_v10 = { package = "sha2", version = "0.10" }
# `zeroize`: wipe Argon2's working memory (the blocks and the initial hash) after each run.
argon2 = { version = "0.6.0", features = ["zeroize"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
data-encoding = "2.11.1"
getrandom = "0.3"
hkdf = "0.13.0"
hmac = "0.13.0"
opaque-ke = { version = "4.0.1", features = ["ristretto255"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }
csv = "1.4.0"
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2"] }
aes = "0.9.3"
cbc = "0.2.1"
pbkdf2 = "0.13.0"
keepass = { version = "0.17.0", features = ["totp"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std", "arithmetic"] }
# Site matching (src/site): WHATWG URL parsing with UTS #46 IDNA like browsers, and the
# linear-time regex engine from rust-lang/regex in its small form (ASCII classes and case
# folding, no Unicode tables: page addresses are short ASCII strings; ~95 KB of WASM, not ~400).
url = "2.5.8"
idna = "1.1.0"
regex-lite = "0.1.9"

[dev-dependencies]
keepass = { version = "0.17.0", features = ["totp", "save_kdbx4"] }
hex = "0.4.3"

[features]
insecure-test-kdf = []
