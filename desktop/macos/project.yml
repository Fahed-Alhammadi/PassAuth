# PassAuth AutoFill for macOS: the credential provider extension embedded in the desktop app
# (PassAuth.app/Contents/PlugIns/PassAuthAutoFill.appex). Generate the Xcode project with:
#   scripts/build-macos-core.sh && cd desktop/macos && xcodegen generate
# Release build (universal, optionally signed): desktop/macos/build.sh.
# (PassAuthAutoFill.xcodeproj and Version.xcconfig are generated and not committed.)
# Sources are shared with iOS: ios/Shared (data layer), ios/AutoFill/AutofillModel.swift
# (the AutoFill flow) and ios/UI/Theme.swift (colours, logo); macOS-only code is in AutoFill/.
name: PassAuthAutoFill
options:
  bundleIdPrefix: io.passauth.desktop
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  preGenCommand: scripts/version.sh
  groupSortPosition: top
configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH[config=Debug]: YES
    DEVELOPMENT_TEAM: JEXQBK3SQ5
    # build.sh signs the finished bundle (Developer ID + provisioning profile, or ad hoc).
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_MODULE_VERIFIER: NO
    ENABLE_HARDENED_RUNTIME: YES
targets:
  # UniFFI bindings of the Rust core (scripts/build-macos-core.sh), as a static library.
  PassAuthCore:
    type: library.static
    platform: macOS
    sources:
      - path: Core/Sources
    dependencies:
      - framework: Core/PassAuthCoreFFI.xcframework
        embed: false
        link: false
    settings:
      base:
        PRODUCT_NAME: PassAuthCore
        # Generated code: Swift 5 mode keeps it free of Swift 6 diagnostics.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SKIP_INSTALL: YES

  # The iOS data layer (ios/Shared), compiled for macOS.
  PassAuthKit:
    type: library.static
    platform: macOS
    sources:
      - path: ../../ios/Shared
        excludes:
          # iOS app only (QR codes from images).
          - QrDecoder.swift
    dependencies:
      - target: PassAuthCore
        link: false
    settings:
      base:
        PRODUCT_NAME: PassAuthKit
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  PassAuthAutoFill:
    type: app-extension
    platform: macOS
    sources:
      - path: AutoFill
        excludes:
          - "*.entitlements"
      - path: ../../ios/AutoFill/AutofillModel.swift
        group: Shared
      - path: ../../ios/UI/Theme.swift
        group: Shared
    dependencies:
      - target: PassAuthKit
      - target: PassAuthCore
      - framework: Core/PassAuthCoreFFI.xcframework
        embed: false
      - sdk: AuthenticationServices.framework
      - sdk: LocalAuthentication.framework
    info:
      path: AutoFill/Info.plist
      properties:
        CFBundleDisplayName: PassAuth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © Fahed Alhammadi
        # https only, except local development servers (VaultRepository.normalizeServer).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The extension's own Keychain group (entitlements; Shared/Keychain.swift).
        PAKeychainGroup: $(DEVELOPMENT_TEAM).io.passauth.desktop.autofill
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionShowsConfigurationUI: true
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              # macOS 15 and later; macOS 14 ignores it.
              ProvidesOneTimeCodes: true
              ShowsConfigurationUI: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.passauth.desktop.autofill
        PRODUCT_NAME: PassAuthAutoFill
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: AutoFill/AutoFill-adhoc.entitlements

  # Logic tests (no host): the macOS-only policy plus the shared data-layer tests from ios/Tests
  # that don't need the iOS app, run against the macOS build of ios/Shared.
  PassAuthAutoFillTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: AutoFill/TimedUnlockPolicy.swift
      - path: ../../ios/Tests/UrlMatcherTests.swift
        group: Tests/Shared
      - path: ../../ios/Tests/ItemJsonTests.swift
        group: Tests/Shared
      - path: ../../ios/Tests/OtpAuthTests.swift
        group: Tests/Shared
      - path: ../../ios/Tests/AutofillTests.swift
        group: Tests/Shared
    dependencies:
      - target: PassAuthKit
      - target: PassAuthCore
      - framework: Core/PassAuthCoreFFI.xcframework
        embed: false
      - sdk: AuthenticationServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.passauth.desktop.autofill.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ""

schemes:
  PassAuthAutoFill:
    build:
      targets:
        PassAuthAutoFill: all
        PassAuthAutoFillTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PassAuthAutoFillTests
    archive:
      config: Release
