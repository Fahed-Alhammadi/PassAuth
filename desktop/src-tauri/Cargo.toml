[package]
name = "passauth-desktop"
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Fahed-Alhammadi/PassAuth"
description = "PassAuth desktop app"
publish = false

# Standalone: not a member of the repository's Rust workspace (the server image and tests never build it),
# so the root workspace's release profile doesn't apply; this one mirrors it.
[workspace]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"

[lib]
name = "passauth_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Clipboard with "concealed"/history-excluded text; no image support needed.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
# OS keychain: macOS Keychain, Windows Credential Manager, Secret Service on Linux (keyring's default stores).
keyring = "4.2"
# Same TLS stack as the updater: rustls with the OS trust store (rustls-platform-verifier), ring as the provider.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
# generate_context! expands to serde_json calls.
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2.5"
tauri-plugin-autostart = "2"

# Vault timeout "On system lock": screen-lock, sleep and session-switch notifications. Same versions Tauri uses.
[target.'cfg(target_os = "macos")'.dependencies]
# Data-protection Keychain item in the AutoFill extension's access group (server/email/Secret Key hand-off).
security-framework = { version = "3.7", features = ["OSX_10_15"] }
core-foundation = "0.10"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSDistributedNotificationCenter", "NSString", "NSOperation", "block2"] }
