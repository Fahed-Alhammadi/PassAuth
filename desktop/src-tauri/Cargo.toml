[package]
name = "passauth-desktop"
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Fahed-Alhammadi/PassAuth"
description = "PassAuth desktop app"
publish = false

# Standalone: not a member of the repository's Rust workspace (the server image and tests never build it).
[workspace]

[lib]
name = "passauth_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Clipboard with "concealed"/history-excluded text; no image support needed.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
# OS keychain: macOS Keychain, Windows Credential Manager, Secret Service on Linux (keyring's default stores).
keyring = "4.2"
# Same TLS stack as the updater: rustls with the OS trust store (rustls-platform-verifier), ring as the provider.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
# generate_context! expands to serde_json calls.
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2.5"
